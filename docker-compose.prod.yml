services:
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prosper_ia_prod
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - prosper_ia_prod_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/prosper_ia.db
      - PORT=8000
      - EMAIL_NOTIFICATIONS_ENABLED=true
      - LEAD_WEBHOOKS_ENABLED=${LEAD_WEBHOOKS_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-edward@agenciaprosperia.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-Digital2@27}
      - SMTP_SENDER=${SMTP_SENDER:-edward@agenciaprosperia.com}
      - NOTIFICATION_EMAIL=edward@agenciaprosperia.com
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador ProsperIA}
      - GHL_PRIVATE_TOKEN=${GHL_PRIVATE_TOKEN:-}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID:-CNvJBINRWBUL2EdqRh3G}
      - GHL_PIPELINE_ID=${GHL_PIPELINE_ID:-SJ4xiMasQ0GZcUNYFgpa}
      - GHL_STAGE_ID=${GHL_STAGE_ID:-ffd8ae02-c4c0-431c-a827-0e909a80c752}

volumes:
  prosper_ia_prod_data:
    name: prosper_ia_prod_data
