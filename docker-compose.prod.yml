services:
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prosper_ia_prod
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - prosper_ia_prod_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/prosper_ia.db
      - PORT=8000
      # Modo silencioso: captura local sin correos ni webhooks salientes.
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-false}
      - LEAD_WEBHOOKS_ENABLED=${LEAD_WEBHOOKS_ENABLED:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador ProsperIA}

volumes:
  prosper_ia_prod_data:
    name: prosper_ia_prod_data
