name: Despliegue Automático en VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en VPS vía SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        if: env.VPS_HOST != '' && (env.VPS_SSH_KEY != '' || env.VPS_PASSWORD != '')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            if [ -n "${{ secrets.VPS_APP_DIR }}" ] && [ -d "${{ secrets.VPS_APP_DIR }}" ]; then
              cd "${{ secrets.VPS_APP_DIR }}"
            elif [ -d "/app/agencia" ]; then
              cd /app/agencia
            elif [ -d "/root/agencia" ]; then
              cd /root/agencia
            elif [ -d "/var/www/agencia" ]; then
              cd /var/www/agencia
            else
              TARGET_DIR=$(find / -maxdepth 3 -name "docker-compose.prod.yml" 2>/dev/null | head -n 1)
              if [ -n "$TARGET_DIR" ]; then
                cd $(dirname "$TARGET_DIR")
              fi
            fi
            echo "Directorio de trabajo: $(pwd)"
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
