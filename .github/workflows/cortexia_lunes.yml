name: Publicación Matutina ProsperIA (Lunes 7:00 AM)

on:
  schedule:
    # 11:00 UTC = 7:00 AM (UTC-4) todos los lunes
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: '¿Publicar en vivo en LinkedIn (Unipile)?'
        type: boolean
        required: true
        default: true
      day:
        description: 'Día del ciclo editorial (1=Lunes a 5=Viernes)'
        required: false
        default: '1'
      topic:
        description: 'Tema específico opcional (dejar vacío para rotación automática)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  execute-monday-routine:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow requests

      - name: Instalar Google Chrome para renderizado de alta fidelidad (opcional)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release xdg-utils
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy install
          google-chrome --version || which google-chrome || true

      - name: Ejecutar Orquestador Matutino
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNIPILE_BASE_URL: ${{ secrets.UNIPILE_BASE_URL }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_EDWARD_ACCOUNT_ID: ${{ secrets.UNIPILE_EDWARD_ACCOUNT_ID }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_OAUTH2_ACCESS_TOKEN: ${{ secrets.X_OAUTH2_ACCESS_TOKEN }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
        run: |
          PUBLISH_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUBLISH_FLAG="--publish"
          fi

          DAY_ARG="--day ${{ inputs.day || '1' }}"
          TOPIC_ARG=""
          if [ -n "${{ inputs.topic }}" ]; then
            TOPIC_ARG="--topic '${{ inputs.topic }}'"
          fi

          python cortexia_daily_orchestrator.py $PUBLISH_FLAG $DAY_ARG $TOPIC_ARG

      - name: Guardar y commitear paquete diario generado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ prosper_ia.db || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para commitear."
          else
            git commit -m "chore(cortexia): paquete diario generado automáticamente [skip ci]"
            git push
          fi
