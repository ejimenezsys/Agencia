name: Generar Artículos del Blog con IA

on:
  schedule:
    # Se ejecuta cada 10 días a las 00:00 UTC
    - cron: '0 0 */10 * *'
  workflow_dispatch:
    # Habilita la ejecución manual desde la pestaña 'Actions' de GitHub

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        architecture: 'x64'
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow

    - name: Ejecutar script de generación de posts con IA
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_ai_posts.py

    - name: Guardar y subir cambios a GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add main.py static/blog/*.jpg
        git commit -m "chore(blog): auto-generar 6 nuevos artículos y portadas con IA [skip ci]" || echo "Sin cambios para commitear"
        git push origin main

    - name: Despliegue automático en VPS (Sin intervención manual)
      if: ${{ secrets.VPS_SSH_KEY != '' }}
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ${{ secrets.VPS_APP_DIR }}
          git pull origin main
