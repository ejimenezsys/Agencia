name: Validar borrador de PROSPERIA Intelligence

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Ruta del borrador JSON que se desea validar'
        required: true
        type: string

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4
      with:

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validar estructura y aprobación humana
      env:
        DRAFT_FILE: ${{ inputs.draft }}
      run: python editorial_workflow.py "$DRAFT_FILE" --publish-check
